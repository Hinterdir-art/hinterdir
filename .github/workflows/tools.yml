name: Werkzeuge (Test-Render, Kanal-IDs, Stimmprobe, Plan)

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Was soll laufen?"
        type: choice
        options: [test-render, voice-test, channels, plan]
        default: test-render

jobs:
  tool:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - if: inputs.task == 'test-render' || inputs.task == 'voice-test'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Ausführen
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          SPEKO_API_KEY: ${{ secrets.SPEKO_API_KEY }}
        run: npm run ${{ inputs.task }}
      - if: inputs.task == 'test-render' || inputs.task == 'voice-test'
        uses: actions/upload-artifact@v4
        with:
          name: test-video
          path: out/media/videos
          retention-days: 3
