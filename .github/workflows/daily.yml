name: Täglich – Videos für morgen produzieren (zur Freigabe)

# Ablauf mit Freigabe:
# 1) Diese Action produziert am Morgen die 3 Videos für MORGEN und stellt sie online.
# 2) Claude zeigt dir Video 1/2/3 um 11:37 / 12:37 / 13:37 zur Freigabe.
# 3) Erst wenn du "passt" sagst, plant Claude es in Buffer ein (Posting am nächsten Tag).

on:
  schedule:
    # 07:23 UTC = 08:23 (Winter) / 09:23 (Sommer) in Wien
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      datum:
        description: "Für welchen Tag? (JJJJ-MM-TT, leer = morgen)"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: ffmpeg installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Datum bestimmen
        run: |
          D="${{ inputs.datum }}"
          if [ -z "$D" ]; then D=$(TZ=Europe/Vienna date -d tomorrow +%F); fi
          echo "DATUM=$D" >> "$GITHUB_ENV"
          echo "Produziere Videos für $D"

      - name: Videos produzieren (Speko + Three.js)
        env:
          SPEKO_API_KEY: ${{ secrets.SPEKO_API_KEY }}
        run: node src/produce.mjs --date "$DATUM"

      - name: Videos auf Media-Branch legen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-media.sh

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Auf GitHub Pages veröffentlichen
        uses: actions/deploy-pages@v4

      - name: Zur Freigabe ablegen (content/freigabe/DATUM)
        run: |
          mkdir -p "content/freigabe/$DATUM"
          cp out/manifest.json "content/freigabe/$DATUM/manifest.json"
          for f in $(jq -r '.items[].queueFile' out/manifest.json); do
            git mv "content/queue/$f" "content/freigabe/$DATUM/$f"
          done
          git config user.name "hinterdir-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          git diff --cached --quiet || (git commit -m "Zur Freigabe: $DATUM" && git push)

      - name: Videos als Download anhängen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: out/media/videos
          retention-days: 7
          if-no-files-found: ignore
