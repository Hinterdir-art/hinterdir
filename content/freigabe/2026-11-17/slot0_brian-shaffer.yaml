id: brian-shaffer
scene: story
script: |
  Eine Kamera filmt, wie er in eine Bar geht. Keine einzige filmt, wie er herauskommt.
  Columbus, Ohio, erster April zweitausendsechs. Brian Shaffer, siebenundzwanzig, Medizinstudent.
  Um ein Uhr fünfzehn fährt er mit Freunden die Rolltreppe zur Bar hinauf.
  Kurz vor zwei steht er vor dem Eingang und redet mit zwei jungen Frauen. Dann geht er aus dem Bild.
  Als die Bar schließt, ist er weg. Kein Anruf. Keine Kontobewegung. Nichts.
  Tage später wollte er mit seiner Freundin nach Miami fliegen. Der Flug geht ohne ihn.
  Monate später klingelt sein Handy plötzlich dreimal, als sie anruft. Dann nie wieder.
  Bis heute fragt die Polizei: Wie verschwindet ein Mensch an einem Ort voller Kameras?
hook: "Rein. Nie raus."
captions: true
