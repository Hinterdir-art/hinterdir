id: somerton-mann
scene: story
script: |
  Ein toter Mann am Strand. Jemand hat jedes Etikett aus seiner Kleidung geschnitten.
  Somerton Beach, Australien, erster Dezember neunzehnhundertachtundvierzig.
  Keine Papiere. Keine Verletzung. Die Ärzte vermuten Gift. Gefunden wird keins.
  In einer winzigen, versteckten Hosentasche: ein Papierfetzen. Darauf zwei Worte. Tamám Shud. Es ist zu Ende.
  Monate später taucht das Buch auf, aus dem der Fetzen gerissen wurde. Es lag im Auto eines Fremden.
  Auf der Rückseite: eine Telefonnummer. Und Zeilen aus wirren Buchstaben. Ein Code, den bis heute niemand geknackt hat.
  Erst vierundsiebzig Jahre später gibt ihm DNA vermutlich einen Namen.
  Aber wie er starb, und für wen dieser Code bestimmt war, weiß niemand.
hook: "Es ist zu Ende"
captions: true
