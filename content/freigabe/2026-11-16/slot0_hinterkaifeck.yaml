id: hinterkaifeck
scene: nebel
script: |
  Ein Bauer findet Fußspuren im Schnee. Sie führen aus dem Wald zu seinem Hof. Aber keine einzige führt zurück.
  Oberbayern, Frühjahr neunzehnhundertzweiundzwanzig. Der Hof heißt Hinterkaifeck.
  Nachts hört die Familie Schritte auf dem Dachboden. Ein Hausschlüssel ist verschwunden. Der Bauer durchsucht alles. Er findet niemanden.
  Am einunddreißigsten März kommt eine neue Magd. Wenige Stunden später sind alle sechs Menschen auf dem Hof tot.
  Gefunden werden sie erst vier Tage später. In dieser Zeit wurde das Vieh versorgt. Und ein Zeuge sah Rauch aus dem Ofen.
  Über hundert Verdächtige. Niemand wurde je verurteilt.
  War er die ganze Zeit schon im Haus?
hook: "Keine Spur zurück"
