id: flannan-isles
scene: story
script: |
  Drei Männer auf einer Insel. Und plötzlich ist das Licht aus.
  Flannan-Inseln, Schottland, Dezember neunzehnhundert.
  Am fünfzehnten Dezember bemerkt ein vorbeifahrendes Dampfschiff: Der Leuchtturm brennt nicht.
  Erst am zweiten Weihnachtstag legt das Versorgungsschiff an.
  Tor und Tür sind geschlossen. Die Lampen geputzt und nachgefüllt, die Küche aufgeräumt.
  Die Uhr hat niemand mehr aufgezogen.
  Zwei Ölmäntel fehlen. Einer hängt noch am Haken.
  Die Behörde vermutet: eine riesige Welle hat sie ins Meer gerissen.
  Gefunden wurde nie jemand.
  Und bis heute weiß niemand, warum einer von ihnen ohne Mantel hinaus ins Unwetter lief.
hook: "Das Licht ist aus"
captions: true
