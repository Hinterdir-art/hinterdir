<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>Hinterdir Renderer</title>
<script type="importmap">
  { "imports": { "three": "/vendor/three/three.module.js",
                 "three/addons/": "/vendor/three/addons/" } }
</script>
<style>
  html, body { margin: 0; padding: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  #stage { position: absolute; inset: 0; }
  canvas { display: block; }
  #hook {
    position: absolute; top: 230px; left: 70px; right: 70px; text-align: center;
    font-weight: 900; font-size: 96px; line-height: 1.05; color: #fff;
    text-shadow: 0 6px 30px rgba(0,0,0,.6); letter-spacing: -1px;
    transition: none;
  }
  #captions {
    position: absolute; left: 60px; right: 60px; bottom: 520px; text-align: center;
    font-weight: 800; font-size: 84px; line-height: 1.1; color: #fff;
    -webkit-text-stroke: 6px rgba(0,0,0,.85); paint-order: stroke fill;
  }
  #captions .on { color: var(--accent, #FFD166); }
  /* YouTube/TikTok/IG-UI verdeckt unten ~300px und rechts ~150px → Inhalte dort vermeiden */
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="hook"></div>
  <div id="captions"></div>
  <script type="module" src="./runtime.js"></script>
</body>
</html>
